name: Lint & build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

jobs:
  lint_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install dependencies
        run: yarn
      - name: Lint
        run: yarn lint
      # Before build:html, which writes to archive/ and would make the latest
      # edition look sent to the signup page.
      - name: Build site
        run: yarn build
      - name: Build email
        run: yarn build:html